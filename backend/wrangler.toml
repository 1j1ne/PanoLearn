name = "panolearn"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[observability]
enabled = false

[vars]
EXTENSION_ID = "bmhhhinalnmeinpnplpdpealkpndcahg"
GOOGLE_CLIENT_ID = "744508273482-0ikpdqb878ojtkonbscdlbcjin2ghsnb.apps.googleusercontent.com"
# Launch limits count API requests, not complete summaries.
USER_DAILY_REQUESTS = "40"
GLOBAL_DAILY_REQUESTS = "300"
USER_DAILY_INPUT_CHARS = "600000"
GLOBAL_DAILY_INPUT_CHARS = "4000000"
# Matches the enabled production service. Set false to pause generation.
GENERATION_ENABLED = "true"

[[durable_objects.bindings]]
name = "LIMITS"
class_name = "UsageLimits"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageLimits"]
